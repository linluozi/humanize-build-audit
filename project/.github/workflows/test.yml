name: Test

on: [push, pull_request, workflow_dispatch]

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "pypy3.12"
          - "pypy3.11"
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt install gettext

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gettext

      # Without msgfmt the compile step is a no-op, and the ~110 locale tests
      # then *skip* instead of failing, so Windows used to report a green run
      # that had silently skipped all of them.
      - name: Install Windows dependencies
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install gettext --no-progress -y
          refreshenv
          msgfmt --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # `shell: bash` is required on Windows: the default pwsh shell does not
      # execute a .sh file, it silently succeeds without running anything.
      - name: Generate translation binaries
        shell: bash
        run: |
          scripts/generate-translation-binaries.sh

      # A build with no compiled catalogs passes 744 tests and skips 112.
      # Assert the catalogs exist so that regression can never look green again.
      - name: Verify translation binaries
        shell: bash
        run: |
          count=$(ls src/humanize/locale/*/LC_MESSAGES/*.mo | wc -l)
          echo "compiled catalogs: $count"
          test "$count" -ge 36

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  success:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
